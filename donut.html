<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Line Distributions — Donut</title>
<style>
  :root{ --bg:#0b0b10; --panel:#15151d; --panel2:#1b1b26; --border:#2a2a3a; --text:#f0f0f6; --text2:#9a9ab0; --accent:#7c5cff; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:"Segoe UI",Inter,Arial,sans-serif;
        display:flex; flex-direction:column; overflow:hidden; }

  header{ display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--border); flex:none; }
  header h1{ font-size:20px; font-weight:900; letter-spacing:.4px; }
  header h1 span{ color:var(--accent); }
  header .spacer{ flex:1; }
  button, select{ border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:9px;
                  padding:9px 13px; cursor:pointer; font:800 14px "Segoe UI",sans-serif; }
  button:hover{ background:#26263a; }
  select{ font-weight:700; }

  #controls{ display:flex; align-items:center; gap:12px; padding:12px 22px; border-bottom:1px solid var(--border); flex:none; }
  #seek{ flex:1; accent-color:var(--accent); cursor:pointer; }
  #time{ font-variant-numeric:tabular-nums; font-weight:800; font-size:15px; color:var(--text2); min-width:110px; text-align:right; }

  #stage{ flex:1; display:flex; align-items:center; gap:26px; padding:20px 34px; min-height:0; }
  #donutwrap{ flex:1 1 auto; height:100%; display:flex; align-items:center; justify-content:center; }
  /* tamaño fijo y cuadrado: la geometría (incl. la porción que sobresale) cabe entera
     dentro del viewBox, así que nada desborda ni recoloca (evita el micro-salto). */
  #donut{ height:min(74vh,42vw); width:min(74vh,42vw); flex:none; }  /* = tamaño del donut del resultado final */
  #donut path{ stroke:var(--bg); stroke-width:1.5; }
  #centerlbl{ font-weight:900; fill:var(--text); text-anchor:middle; }
  #centersub{ fill:var(--text2); text-anchor:middle; font-weight:700; }

  #legend{ flex:0 0 360px; display:flex; flex-direction:column; gap:6px; overflow-y:auto; max-height:100%; padding-right:4px; }
  .lg{ display:flex; align-items:center; gap:10px; padding:7px 11px; border-radius:8px;
       background:var(--panel); border:1px solid transparent; }
  .lg.sing{ border-color:var(--c); background:#191924; }
  .lg .dot{ width:13px; height:13px; border-radius:3px; background:var(--c); flex:none; }
  .lg .nm{ font-size:14px; font-weight:800; flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lg .val{ font-variant-numeric:tabular-nums; font-weight:800; font-size:13px; color:var(--text2); flex:none; }
  .lg .val b{ color:var(--text); }
  .empty{ color:var(--text2); font-size:15px; padding:40px; margin:auto; }
</style>
</head>
<body>
  <header>
    <button id="back">← Biblioteca</button>
    <h1>Donut <span>Distribution</span></h1>
    <div class="spacer"></div>
    <select id="songSel" title="Elegir canción"></select>
  </header>

  <div id="controls">
    <button id="play">▶</button>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1">
    <span id="time">0:00 / 0:00</span>
    <button id="mute" title="Silenciar / activar audio">🔊</button>
  </div>

  <div id="stage">
    <div id="donutwrap">
      <svg id="donut" viewBox="0 0 500 500">
        <g id="slices"></g>
        <text id="centerlbl" x="250" y="245" font-size="34">—</text>
        <text id="centersub" x="250" y="278" font-size="16">cantando</text>
      </svg>
    </div>
    <div id="legend"></div>
  </div>

  <video id="vid" style="display:none"></video>
<script src="js/donut.js"></script>
</body>
</html>
