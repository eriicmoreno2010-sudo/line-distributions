<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recortar y quitar fondo</title>
<style>
  :root{ --bg:#0b0b10; --panel:#15151d; --panel2:#1b1b26; --border:#2a2a3a; --text:#f0f0f6; --text2:#9a9ab0; --accent:#7c5cff; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:"Montserrat","Segoe UI",Arial,sans-serif;
        display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header{ display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border); flex:none; flex-wrap:wrap; }
  h1{ font-size:17px; font-weight:900; } h1 small{ color:var(--text2); font-weight:700; font-size:12px; margin-left:8px; }
  .who{ font-size:15px; font-weight:800; color:var(--accent); }
  .spacer{ flex:1; }
  button{ border:0; border-radius:9px; padding:9px 13px; font:800 13px "Segoe UI",Arial; cursor:pointer;
          background:var(--panel2); color:var(--text); border:1px solid var(--border); }
  button:hover:not(:disabled){ background:#26263a; }
  button.pri{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button.pri:hover{ background:#6a49f2; }
  button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled{ opacity:.45; cursor:default; }

  .toolbar{ display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid var(--border); flex:none; flex-wrap:wrap; }
  .grp{ display:flex; align-items:center; gap:7px; }
  .lbl{ color:var(--text2); font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; }
  input[type=range]{ width:130px; accent-color:var(--accent); }
  .val{ font-size:12px; font-weight:800; color:var(--text2); min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }

  main{ flex:1; min-height:0; position:relative; background:#0d0d12; }
  #view{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #ov{ position:fixed; inset:0; background:rgba(8,8,12,.9); display:none; align-items:center; justify-content:center; z-index:100; }
  #ov.show{ display:flex; } #ov .t{ font-size:18px; font-weight:900; }

  .hint{ color:var(--text2); font-size:12px; font-weight:700; }
</style>
<!-- La librería de IA importa "onnxruntime-web" (bare specifier); este mapa lo
     resuelve a la copia local (no descarga JS). -->
<script type="importmap">
{ "imports": {
  "onnxruntime-web": "vendor/ort/ort.wasm.bundle.min.mjs",
  "onnxruntime-web/webgpu": "vendor/ort/ort.wasm.bundle.min.mjs"
}}
</script>
</head>
<body>
<header>
  <button onclick="location.href='library.html'">←  Biblioteca</button>
  <h1>✂️ Recortar con lazo <small>rodea lo que quieras conservar → se añade a la capa "Recorte"</small></h1>
  <span class="who" id="who">—</span>
  <span class="spacer"></span>
  <span class="hint">Rueda = zoom · "✋" = mover</span>
  <button class="pri" id="save">💾  Guardar recorte</button>
</header>

<div class="toolbar">
  <div class="grp">
    <button id="tLazo" class="on" title="Rodea lo que quieras conservar; esa zona se añade a la capa activa">🎯 Lazo</button>
    <button id="tCirc" title="Recorta un CÍRCULO perfecto: arrastra desde el centro hacia fuera">⭕ Círculo</button>
    <button id="tErase" title="Borra (quita) de la capa recorte ACTIVA — arrastra">🩹 Borrar</button>
    <button id="tPan" title="Mover la vista (arrastra)">✋ Mover</button>
  </div>
  <div class="grp" id="brushGrp" style="display:none"><span class="lbl">Pincel</span>
    <input type="range" id="brush" min="6" max="220" step="1" value="70"><span class="val" id="brushV">70</span></div>
  <div class="grp">
    <button id="aiBg" class="pri" title="Recorta a la persona con IA (bordes limpios, pelo incluido). La 1ª vez descarga el modelo (~95MB); luego funciona sin internet.">🤖 Recortar con IA</button>
    <span class="lbl">Solidez</span>
    <input type="range" id="aiSolid" min="0" max="100" step="1" value="0"><span class="val" id="aiSolidV">0</span></div>
  <div class="grp">
    <button id="autoBg" title="Quita el fondo por COLOR de la capa recorte activa (para fondos lisos; rodea antes con el lazo dejando margen)">✨ Fondo por color</button>
    <span class="lbl">Sensib.</span>
    <input type="range" id="tol" min="8" max="170" step="1" value="55"><span class="val" id="tolV">55</span></div>
  <span class="spacer"></span>
  <div class="grp">
    <span class="lbl">Capas</span>
    <button id="layOrig" class="on" title="Ver/ocultar la foto ORIGINAL (de guía, atenuada)">👁 Original</button>
    <span id="layerList" style="display:flex;gap:6px"></span>
    <button id="addLayer" title="Añadir otra capa de recorte">➕ Capa</button>
    <button id="delLayer" title="Borrar la capa activa">🗑</button>
  </div>
  <span class="spacer"></span>
  <div class="grp">
    <button id="undo" disabled>↶ Deshacer</button>
    <button id="reset">⟲ Vaciar capa</button>
    <button id="fit">⊡ Ajustar</button>
  </div>
</div>

<main><canvas id="view"></canvas></main>

<div id="ov"><div class="t" id="ovT">Guardando…</div></div>

<script src="js/cutout.js?v=11"></script>
</body>
</html>
