<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor — visualizador glossy</title>
<style>
  :root{ --c1:#25e0f2; --c2:#ff2fb0; --beat:0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:#04060d; color:#eef; font-family:"Montserrat","Segoe UI",Arial,sans-serif;
        overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #stage{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }

  /* ---- fondo: sala oscura con rayas de luz y bokeh ---- */
  #bg{ position:absolute; inset:0; overflow:hidden; z-index:0;
       background:
         radial-gradient(70% 55% at 50% 42%, #0e1430 0%, transparent 70%),
         linear-gradient(#04060d,#05070f); }
  .streak{ position:absolute; top:-10%; width:2px; height:120%; filter:blur(2px); opacity:.35;
           background:linear-gradient(#fff,transparent); transform:rotate(8deg); }
  .beam{ position:absolute; border-radius:50%; filter:blur(50px); opacity:.22; }
  #b1{ left:8%; top:18%; width:34vmin; height:34vmin; background:var(--c1); }
  #b2{ right:8%; bottom:14%; width:34vmin; height:34vmin; background:var(--c2); }
  .dot{ position:absolute; width:3px; height:3px; border-radius:50%; background:#dfe8ff; opacity:.5;
        animation:float linear infinite; }
  @keyframes float{ from{ transform:translateY(30px); opacity:0 } 12%{opacity:.7} 88%{opacity:.7} to{ transform:translateY(-70vh); opacity:0 } }

  /* onda a lo ancho, por detrás del cristal */
  #wave{ position:absolute; left:0; top:50%; transform:translateY(-50%); width:100%; height:78vmin; z-index:1; pointer-events:none; }

  /* ---- marco de cristal (glassmorphism) ---- */
  #frame{ position:relative; z-index:2; width:min(860px,80vw); aspect-ratio:16/9.2;
          border-radius:30px; padding:5.2%;
          background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
          border:1px solid rgba(210,230,255,.35);
          box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,
                     0 40px 120px -40px #000,
                     0 0 calc(40px + var(--beat)*60px) rgba(90,180,255,calc(.10 + var(--beat)*.22));
          -webkit-backdrop-filter:blur(7px) saturate(1.2); backdrop-filter:blur(7px) saturate(1.2);
          display:flex; flex-direction:column; justify-content:center; }
  /* segundo borde interior fino */
  #frame::before{ content:""; position:absolute; inset:14px; border-radius:22px;
                  border:1px solid rgba(180,210,255,.14); pointer-events:none; }

  #top{ display:flex; gap:26px; align-items:center; }
  #cover{ width:23%; aspect-ratio:1; border-radius:14px; object-fit:cover; flex:none;
          box-shadow:0 16px 40px -10px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.12);
          transform:scale(calc(1 + var(--beat)*.03)); transition:transform .06s linear; }
  #meta{ min-width:0; }
  #nowplaying{ font-size:clamp(11px,1.2vw,14px); font-weight:800; letter-spacing:3px; text-transform:uppercase;
               color:#8fa4d6; margin-bottom:7px; }
  #title{ font-size:clamp(20px,3.4vw,40px); font-weight:900; letter-spacing:.5px; line-height:1;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
          text-shadow:0 2px 20px rgba(120,190,255,.35); }
  #artist{ font-size:clamp(12px,1.5vw,18px); font-weight:700; color:#aebbdd; margin-top:8px; letter-spacing:3px; text-transform:uppercase; }

  #prog{ margin-top:6%; }
  #bar{ height:5px; border-radius:999px; background:rgba(255,255,255,.16); cursor:pointer; position:relative; }
  #fill{ position:absolute; left:0; top:0; bottom:0; width:0%;
         background:linear-gradient(90deg,var(--c1),var(--c2)); border-radius:999px; box-shadow:0 0 12px var(--c1); }
  #knob{ position:absolute; top:50%; width:13px; height:13px; border-radius:50%; background:#fff; left:0;
         transform:translate(-50%,-50%); box-shadow:0 0 10px #fff; }
  #times{ display:flex; justify-content:space-between; margin-top:8px; font-size:clamp(11px,1.2vw,14px); color:#aebbdd; font-variant-numeric:tabular-nums; }

  #controls{ display:flex; align-items:center; justify-content:center; gap:6%; margin-top:5%; position:relative; }
  .ctl{ background:none; border:0; color:#e8eeff; cursor:pointer; display:grid; place-items:center;
        filter:drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
  .ctl svg{ width:26px; height:26px; fill:currentColor; }
  #play{ width:66px; height:66px; border-radius:50%; color:#eef;
         background:rgba(255,255,255,.05);
         border:2px solid rgba(255,255,255,.9);
         box-shadow:0 0 22px rgba(120,200,255,.35); }
  #play svg{ width:26px; height:26px; }
  #shuffle{ position:absolute; right:2%; width:46px; height:46px; border-radius:50%;
            border:1.5px solid rgba(255,255,255,.45); }
  #shuffle.on{ color:var(--c1); border-color:var(--c1); box-shadow:0 0 16px var(--c1); }

  /* portadas del álbum a los lados */
  .side{ position:absolute; top:50%; transform:translateY(-50%); z-index:2; display:flex; flex-direction:row; gap:26px; }
  #sideL{ left:2vw; } #sideR{ right:2vw; }
  .scard{ width:130px; cursor:pointer; opacity:.62; transition:opacity .2s, transform .2s; text-align:center; }
  .scard:hover{ opacity:1; transform:scale(1.06); }
  .sthumb{ width:130px; height:130px; border-radius:16px; background-size:cover; background-position:center;
           background-image:linear-gradient(135deg, rgba(37,224,242,.35), rgba(255,47,176,.35));
           box-shadow:0 12px 30px -10px #000, 0 0 0 1px rgba(255,255,255,.10); }
  .sname{ margin-top:9px; font-size:13px; font-weight:800; color:#d6ddf5; line-height:1.2; letter-spacing:.3px;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .hint{ position:absolute; bottom:14px; left:0; right:0; text-align:center; color:#5d6c92; font-size:13px; z-index:3; }
  @media(max-width:820px){ .side{ display:none; } #frame{ width:92vw; } }
</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <div class="beam" id="b1"></div><div class="beam" id="b2"></div>
  </div>
  <canvas id="wave"></canvas>

  <div class="side" id="sideL"></div>

  <div id="frame">
    <div id="top">
      <img id="cover" alt="">
      <div id="meta">
        <div id="nowplaying">Now playing…</div>
        <div id="title">—</div>
        <div id="artist"></div>
      </div>
    </div>
    <div id="prog">
      <div id="bar"><div id="fill"></div><div id="knob"></div></div>
      <div id="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div id="controls">
      <button class="ctl" id="prev" title="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="ctl" id="play" title="Reproducir"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctl" id="next" title="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
      <button class="ctl" id="shuffle" title="Aleatorio"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-3l-2.5 3.5L9 8H3V6h5l2.5 3.5L13 6h4V3zM3 16h5l2.5-3.5 1.2 1.7-2.6 3.8H3v-2zm14-2v-3l4 4-4 4v-3h-3l-2.2-3.2 1.2-1.7L14 14h3z"/></svg></button>
    </div>
  </div>

  <div class="side" id="sideR"></div>

  <!-- <div class="hint">▶ Pulsa play — la onda y el brillo reaccionan a la música. (Prueba)</div> -->
</div>

<audio id="aud" preload="metadata"></audio>

<script>
  const AUDIO_DIR = "audio/";
  const SMOOTHIE = "NCT DREAM (엔씨티 드림) 'Smoothie' Official Audio.mp3";
  const DIVE     = "NCT DREAM - 고래 Dive into You.mp3";
  const ALBUM    = "covers/smoothie_album.jpg";   // portada por defecto (cambia cada cover cuando tengas más)
  const TRACKS = [
    { title:"icantfeelanything",     artist:"NCT DREAM", file:DIVE, cover:ALBUM },
    { title:"Smoothie",         artist:"NCT DREAM", file:SMOOTHIE,     cover:ALBUM }, // <- actual
    { title:"BOX",           artist:"NCT DREAM", file:DIVE, cover:ALBUM }, 
    { title:"Carat Cake", artist:"NCT DREAM", file:SMOOTHIE,   cover:ALBUM },
    { title:"UNKNOWN",            artist:"NCT DREAM", file:DIVE, cover:ALBUM },
    { title:"숨 (Breathing)",            artist:"NCT DREAM", file:SMOOTHIE, cover:ALBUM }
  ];
  let idx = 1, shuffle = false;
  const $ = id => document.getElementById(id);
  const aud = $("aud"), cover = $("cover"), fill = $("fill"), knob = $("knob");
  const fmt = s => { s = Math.max(0, s|0); return (s/60|0) + ":" + String(s%60).padStart(2,"0"); };

  function loadTrack(i, autoplay){
    idx = (i + TRACKS.length) % TRACKS.length; const t = TRACKS[idx];
    aud.src = AUDIO_DIR + encodeURIComponent(t.file);
    cover.src = t.cover + "?v=27";
    $("title").textContent = t.title; $("artist").textContent = t.artist;
    $("cur").textContent = "0:00"; $("dur").textContent = "0:00"; fill.style.width = "0%"; knob.style.left = "0%";
    buildSides(); if(autoplay) play();
  }
  const WIN = 2;   // cuántas canciones mostrar a cada lado (ventana alrededor de la actual)
  function buildSides(){
    const L = $("sideL"), R = $("sideR"); L.innerHTML = ""; R.innerHTML = "";
    TRACKS.forEach((t,i)=>{ if(i===idx) return;
      if(i < idx-WIN || i > idx+WIN) return;   // solo las cercanas, no todas
      const c = document.createElement("div"); c.className = "scard"; c.title = t.title; c.onclick = () => loadTrack(i, true);
      const th = document.createElement("div"); th.className = "sthumb";
      if(t.cover) th.style.backgroundImage = "url('" + t.cover + "?v=27')";
      const nm = document.createElement("div"); nm.className = "sname"; nm.textContent = t.title;
      c.append(th, nm); (i < idx ? L : R).appendChild(c); });
  }

  // Web Audio
  let ctx, analyser, tdata, srcNode, beat = 0;
  function initAudio(){ if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    srcNode = ctx.createMediaElementSource(aud);
    analyser = ctx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.6;
    tdata = new Uint8Array(analyser.fftSize);
    freq  = new Uint8Array(analyser.frequencyBinCount);
    srcNode.connect(analyser); analyser.connect(ctx.destination); }
  let freq;
  async function play(){ initAudio(); if(ctx.state==="suspended") await ctx.resume(); try{ await aud.play(); }catch(e){} }
  function pause(){ aud.pause(); }
  $("play").onclick = () => aud.paused ? play() : pause();
  aud.onplay  = () => $("playIcon").innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  aud.onpause = () => $("playIcon").innerHTML = '<path d="M8 5v14l11-7z"/>';
  aud.onended = () => next();
  $("prev").onclick = () => loadTrack(idx-1, true);
  $("next").onclick = () => next();
  function next(){ loadTrack(shuffle ? Math.floor(idx+1+Math.random()*(TRACKS.length-1)) : idx+1, true); }
  $("shuffle").onclick = () => { shuffle=!shuffle; $("shuffle").classList.toggle("on",shuffle); };
  aud.ontimeupdate = () => { if(aud.duration){ const p=aud.currentTime/aud.duration*100;
    fill.style.width=p+"%"; knob.style.left=p+"%"; $("cur").textContent=fmt(aud.currentTime); $("dur").textContent=fmt(aud.duration); } };
  aud.onloadedmetadata = () => $("dur").textContent = fmt(aud.duration||0);
  $("bar").onclick = e => { if(!aud.duration) return; const r=$("bar").getBoundingClientRect();
    aud.currentTime=(e.clientX-r.left)/r.width*aud.duration; };

  // ---- canvas: onda de LÍNEA continua (osciloscopio) cian->magenta ----
  const cv = $("wave"), cx = cv.getContext("2d");
  const DPR = () => Math.min(2, window.devicePixelRatio||1);
  function resize(){ const r=cv.getBoundingClientRect(), d=DPR(); cv.width=r.width*d; cv.height=r.height*d; cx.setTransform(d,0,0,d,0,0); }
  window.addEventListener("resize", resize); resize();

  function draw(){
    const d=DPR(), w=cv.width/d, h=cv.height/d, mid=h/2;
    cx.clearRect(0,0,w,h);
    if(analyser){
      analyser.getByteFrequencyData(freq);
      let s=0; for(let i=1;i<8;i++) s+=freq[i]; const bass=(s/7)/255;
      const target=Math.min(1,bass*1.5); if(target>beat) beat=target; else beat+=(target-beat)*0.12;
      document.documentElement.style.setProperty("--beat", beat.toFixed(3));

      // barritas cian->magenta reactivas (crecen arriba y abajo desde el centro)
      const N=72, bw=w/N, gap=bw*0.52, iw=bw-gap;
      const grad=cx.createLinearGradient(0,0,w,0);
      grad.addColorStop(0,getCss("--c1")); grad.addColorStop(.5,"#b56bff"); grad.addColorStop(1,getCss("--c2"));
      cx.fillStyle=grad; cx.shadowColor="rgba(120,200,255,.85)"; cx.shadowBlur=14;
      for(let i=0;i<N;i++){
        const fi=Math.floor(Math.pow(i/(N-1),1.4)*(freq.length*0.7));
        const v=(freq[fi]||0)/255; const bh=Math.max(3, v*v*h*0.42);
        roundRect(i*bw+gap/2, mid-bh, iw, bh*2, iw/2); cx.fill();
      }
      cx.shadowBlur=0;
    }
    requestAnimationFrame(draw);
  }
  function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); cx.beginPath();
    cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r);
    cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||"#25e0f2"; }
  requestAnimationFrame(draw);

  // fondo: rayas de luz + motas
  (function scene(){ const bg=$("bg");
    for(let i=0;i<7;i++){ const s=document.createElement("div"); s.className="streak";
      s.style.left=(8+Math.random()*84)+"%"; s.style.height=(60+Math.random()*60)+"%";
      s.style.opacity=(.12+Math.random()*.3); s.style.transform="rotate("+(6+Math.random()*6)+"deg)"; bg.appendChild(s); }
    for(let i=0;i<28;i++){ const dt=document.createElement("div"); dt.className="dot";
      dt.style.left=(Math.random()*100)+"%"; dt.style.top=(Math.random()*100)+"%";
      dt.style.animationDuration=(6+Math.random()*8)+"s"; dt.style.animationDelay=(-Math.random()*12)+"s"; bg.appendChild(dt); }
  })();

  loadTrack(1, false);
</script>
</body>
</html>
