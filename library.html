<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Line Distributions — Biblioteca</title>
<style>
  :root{ --bg:#0b0b10; --panel:#15151d; --panel2:#1b1b26; --border:#2a2a3a; --text:#f0f0f6; --text2:#9a9ab0; --accent:#7c5cff; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:"Segoe UI",Inter,Arial,sans-serif; padding:36px 44px; overflow-y:auto; }
  header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; }
  h1{ font-size:30px; font-weight:900; letter-spacing:.5px; }
  h1 span{ color:var(--accent); }
  .sub{ color:var(--text2); font-size:14px; margin-top:4px; }
  #grid, #albumgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px; }
  .secttl{ font-size:14px; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; color:var(--text2); margin:4px 0 14px; }
  #albumsect{ margin-bottom:34px; }
  .card.album{ background:linear-gradient(140deg,#241b3d,#152238); border-color:#3a3358; }
  .card .cover{ width:100%; height:150px; border-radius:12px; object-fit:cover; background:var(--panel2); }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .card .grp{ color:var(--text2); font-size:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; }
  .card .name{ font-size:24px; font-weight:900; line-height:1.1; }
  .card .meta{ color:var(--text2); font-size:13px; }
  .avatars{ display:flex; }
  .avatars img{ width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--panel); margin-left:-10px; background:var(--panel2); }
  .avatars img:first-child{ margin-left:0; }
  .actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
  button{ flex:1; padding:11px 14px; font:800 14px "Segoe UI",sans-serif; border:0; border-radius:10px; cursor:pointer; }
  .open{ background:var(--panel2); color:var(--text); border:1px solid var(--border); }
  .open:hover{ background:#232333; }
  .edit{ background:#1f3a4d; color:#dff1ff; border:1px solid #2a5a72; }
  .edit:hover{ background:#274a63; }
  .fotos{ background:#3a2f4d; color:#eadfff; border:1px solid #4a3a6a; }
  .fotos:hover{ background:#463a5e; }
  .danger{ background:#4a1f26; color:#ffd7dc; border:1px solid #7a2e3a; flex:0 0 auto; }
  .danger:hover{ background:#5e2731; }
  .danger:disabled{ opacity:.6; cursor:default; }
  .exp{ background:var(--accent); color:#fff; }
  .exp:hover{ background:#6a49f2; }
  .empty{ color:var(--text2); font-size:15px; padding:40px 0; }
  #overlay{ position:fixed; inset:0; background:rgba(8,8,12,.92); display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:100; }
  #overlay.show{ display:flex; }
  #ovtitle{ font-size:20px; font-weight:800; }
  #ovsub{ color:var(--text2); font-size:14px; max-width:600px; text-align:center; }
  #bar{ width:min(520px,70vw); height:14px; background:var(--panel2); border-radius:999px; overflow:hidden; border:1px solid var(--border); }
  #fill{ height:100%; width:0; background:var(--accent); transition:width .2s; }

  /* botones de crear (cabecera) */
  .headbtns{ display:flex; gap:10px; flex:none; }
  .newbtn{ padding:11px 16px; font:800 14px "Segoe UI",sans-serif; border:0; border-radius:10px; cursor:pointer;
           background:var(--accent); color:#fff; }
  .newbtn:hover{ background:#6a49f2; }
  .newbtn.ng{ background:var(--panel2); color:var(--text); border:1px solid var(--border); }
  .newbtn.ng:hover{ background:#232333; }

  /* modal crear cancion */
  #newmodal{ position:fixed; inset:0; background:rgba(8,8,12,.8); display:none; align-items:center; justify-content:center; z-index:200; }
  #newmodal.show{ display:flex; }
  #newmodal .box{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:26px 28px;
                  width:min(460px,92vw); display:flex; flex-direction:column; gap:16px; }
  #newmodal .mtitle{ font-size:20px; font-weight:900; }
  #newmodal .field{ display:flex; flex-direction:column; gap:6px; }
  #newmodal label{ color:var(--text2); font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
  #newmodal input, #newmodal select, #newmodal textarea{
    background:var(--panel2); border:1px solid var(--border); border-radius:10px; color:var(--text);
    padding:11px 13px; font:600 15px "Segoe UI",sans-serif; resize:vertical; }
  #newmodal .mactions{ display:flex; gap:10px; margin-top:4px; }
  #newmodal .mcancel{ flex:1; background:var(--panel2); color:var(--text); border:1px solid var(--border); }
  #newmodal .mcreate{ flex:1; background:var(--accent); color:#fff; border:0; }
  #newmodal .merror{ color:#ff8080; font-size:13px; min-height:16px; }

  /* modal crear álbum */
  #albummodal{ position:fixed; inset:0; background:rgba(8,8,12,.8); display:none; align-items:center; justify-content:center; z-index:200; }
  #albummodal.show{ display:flex; }
  #albummodal .box{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:26px 28px;
                    width:min(560px,92vw); max-height:88vh; overflow:auto; display:flex; flex-direction:column; gap:16px; }
  #albummodal .mtitle{ font-size:20px; font-weight:900; }
  #albummodal .field{ display:flex; flex-direction:column; gap:6px; }
  #albummodal label{ color:var(--text2); font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
  #albummodal input, #albummodal select{ background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); padding:11px 13px; font:600 15px "Segoe UI",sans-serif; }
  #albummodal .mactions{ display:flex; gap:10px; margin-top:4px; }
  #albummodal .mcancel{ flex:1; background:var(--panel2); color:var(--text); border:1px solid var(--border); }
  #albummodal .mcreate{ flex:1; background:var(--accent); color:#fff; border:0; }
  #albummodal .merror{ color:#ff8080; font-size:13px; min-height:16px; }
  .songpick{ display:flex; flex-direction:column; gap:4px; max-height:240px; overflow:auto;
    border:1px solid var(--border); border-radius:10px; padding:8px 10px; background:var(--panel2); }
  .songpick label{ display:flex; align-items:center; gap:9px; text-transform:none; letter-spacing:0;
    font-size:14px; font-weight:600; color:var(--text); cursor:pointer; padding:3px 0; }
  .songpick input{ width:auto; padding:0; }
  .songpick .ord{ color:var(--accent); font-weight:900; min-width:22px; }
  .songpick .none{ color:var(--text2); font-size:13px; padding:6px 2px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Line <span>Distributions</span></h1>
      <div class="sub">Biblioteca de canciones — abre para ver, o exporta el vídeo en 1080p.</div>
    </div>
    <div class="headbtns">
      <button id="transcribeBtn" class="newbtn ng">🎙️  Transcribir</button>
      <button id="cutterBtn" class="newbtn ng">✂️  Cortar vídeo</button>
      <button id="nowplayingBtn" class="newbtn ng">🎧  Now Playing</button>
      <button id="donutBtn" class="newbtn ng">🍩  Donut</button>
      <button id="newAlbum" class="newbtn ng">💿  Nuevo álbum</button>
      <button id="newSong" class="newbtn">➕  Nueva canción</button>
      <button id="newGroup" class="newbtn ng">➕  Nueva canción + grupo</button>
    </div>
  </header>

  <div id="albumsect" style="display:none">
    <div class="secttl">💿 Álbumes</div>
    <div id="albumgrid"></div>
  </div>

  <div class="secttl" id="songsttl" style="display:none">🎵 Canciones</div>
  <div id="grid"></div>

  <div id="albummodal">
    <div class="box">
      <div class="mtitle">Nuevo álbum</div>
      <div class="field">
        <label>Grupo</label>
        <select id="alGroup"></select>
      </div>
      <div class="field">
        <label>Nombre del álbum</label>
        <input id="alName" placeholder="p. ej. Beat It Up">
      </div>
      <div class="field">
        <label>Fondo</label>
        <select id="alTheme">
          <option value="dark">Negro (oscuro)</option>
          <option value="light">Blanco (claro)</option>
        </select>
      </div>
      <div class="field">
        <label>Canciones del álbum (marca y ordena arriba→abajo)</label>
        <div id="alSongs" class="songpick"></div>
      </div>
      <div class="mactions">
        <button id="alCancel" class="mcancel">Cancelar</button>
        <button id="alCreate" class="mcreate">Crear álbum</button>
      </div>
      <div id="alError" class="merror"></div>
    </div>
  </div>

  <div id="newmodal">
    <div class="box">
      <div class="mtitle" id="mtitle">Nueva canción</div>
      <div class="field" id="fGroupSelect">
        <label>Grupo</label>
        <select id="groupSelect"></select>
      </div>
      <div class="field" id="fGroupName" style="display:none">
        <label>Nombre del grupo</label>
        <input id="groupName" placeholder="p. ej. Stray Kids">
      </div>
      <div class="field" id="fMembers" style="display:none">
        <label>Miembros (uno por línea)</label>
        <textarea id="membersTa" rows="6" placeholder="Bang Chan&#10;Lee Know&#10;Changbin&#10;Hyunjin&#10;..."></textarea>
      </div>
      <div class="field">
        <label>Nombre de la canción</label>
        <input id="songName" placeholder="p. ej. Into The Sea">
      </div>
      <div class="field">
        <label>Fondo</label>
        <select id="themeSelect">
          <option value="dark">Negro (oscuro)</option>
          <option value="light">Blanco (claro)</option>
        </select>
      </div>
      <div class="field">
        <label>Tipo</label>
        <select id="unitSelect">
          <option value="group">Grupo completo (ocupa toda la derecha)</option>
          <option value="subunit">Sub-unidad / solista (tarjetas arriba, tamaño de 8)</option>
        </select>
      </div>
      <div class="mactions">
        <button id="mCancel" class="mcancel">Cancelar</button>
        <button id="mCreate" class="mcreate">Crear</button>
      </div>
      <div id="merror" class="merror"></div>
    </div>
  </div>

  <div id="overlay">
    <div id="ovtitle">Exportando vídeo 1080p…</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="ovsub">Renderizando fotograma a fotograma. Puede tardar varios minutos. No cierres la app.</div>
  </div>

<script src="js/library.js"></script>
</body>
</html>
