<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- evita el popup de "Google Translate" al detectar japonés -->
    <meta name="google" content="notranslate">

    <title>Line Distribution</title>

    <!-- ========================= -->
    <!-- CSS -->
    <!-- ========================= -->

    <link rel="stylesheet" href="css/style.css?v=15">

    <link rel="stylesheet" href="css/video.css?v=15">

    <link rel="stylesheet" href="css/ranking.css?v=15">

    <link rel="stylesheet" href="css/lyrics.css?v=15">

    <link rel="stylesheet" href="css/animations.css?v=15">

</head>

<body>

<div id="app">

    <!-- ===================================== -->
    <!-- LEFT RANKING (only shown for groups > 10 members) -->
    <!-- ===================================== -->

    <aside id="left-panel-rank">
        <section id="ranking-left"></section>
    </aside>

    <!-- ===================================== -->
    <!-- CENTER PANEL (video + lyrics) -->
    <!-- ===================================== -->

    <section id="left-panel">

        <!-- ========================= -->
        <!-- HEADER -->
        <!-- ========================= -->

        <header id="top-bar">

            <div id="song-info">

                <h1 id="group-name">

                    NCT DREAM

                </h1>

                <h2 id="song-name">

                    Moonlight

                </h2>

            </div>

            <div id="song-time">

                <span id="current-time">

                    00:00

                </span>

                <span>

                    /

                </span>

                <span id="duration">

                    00:00

                </span>

            </div>

        </header>

        <!-- ========================= -->
        <!-- VIDEO -->
        <!-- ========================= -->

        <section id="video-section">

            <video
                id="video"
                preload="metadata"
                controls>

            </video>

        </section>

                <!-- ========================= -->
        <!-- LYRICS -->
        <!-- ========================= -->

        <section id="lyrics-container">

            <!-- LETRAS -->

            <section id="lyrics-section">

                <h2 id="current-member">


                </h2>

                <p id="original">


                </p>

                <p id="romanized">


                </p>

                <p id="english">


                </p>

            </section>

            <!-- AD-LIBS -->

            <aside id="adlibs-section">

                <!--
                    Los ad-libs aparecerán aquí
                    automáticamente mediante JavaScript.
                -->

            </aside>

        </section>

    </section>

    <!-- ===================================== -->
    <!-- RIGHT PANEL -->
    <!-- ===================================== -->

    <aside id="right-panel">

        <section id="ranking">

            <!--
                JavaScript generará aquí
                todas las tarjetas del ranking.
            -->

        </section>

    </aside>

        <!-- ========================= -->
    <!-- TIMELINE -->
    <!-- ========================= -->

    <section id="timeline-section">

        <div id="timeline">

    <div id="timeline-cursor"></div>

        </div>

    </section>


<!-- ===================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================== -->

<script src="js/config.js?v=15"></script>

<script src="js/ui.js?v=15"></script>

<script src="js/player.js?v=15"></script>

<script src="js/ranking.js?v=15"></script>

<script src="js/lyrics.js?v=15"></script>

<script src="js/timeline.js?v=15"></script>
    
<script src="js/engine.js?v=15"></script>

<script src="js/app.js?v=15"></script>

<script src="js/results-overlay.js?v=15"></script>

<script src="js/rec-mode.js?v=15"></script>

<script src="js/render-mode.js?v=15"></script>

<script src="js/desktop-nav.js?v=15"></script>

<script src="js/auto-play.js?v=15"></script>

</body>

</html>
