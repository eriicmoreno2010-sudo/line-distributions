<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Miniatura</title>
<style>
  :root{ --w:1280px; --h:720px; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#05050a; }
  /* fixed YouTube-thumbnail canvas, scaled to fit the window for preview */
  #thumb{
    position:relative; width:var(--w); height:var(--h); overflow:hidden;
    background:#0b0b12; font-family:"Segoe UI",Inter,Arial,sans-serif; color:#fff;
    transform-origin:top left;
  }

  /* LEFT — big cover photo */
  #cover{ position:absolute; inset:0 42% 0 0; background:#0b0b12; overflow:hidden; }
  /* posición/escala/rotación se calculan en JS (encuadre a la cara vía frame) */
  #cover img{ position:absolute; display:block; }
  /* dark gradient bottom-left so the title reads on any photo */
  #shade{ position:absolute; inset:0 42% 0 0; background:
      linear-gradient(180deg, rgba(0,0,0,.10) 45%, rgba(0,0,0,.82) 100%),
      linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0) 40%); }
  /* soft seam between photo and ranking */
  #seam{ position:absolute; top:0; bottom:0; left:58%; width:120px; transform:translateX(-50%);
         background:linear-gradient(90deg, rgba(11,11,18,0), var(--panel,#0e0e18)); }

  /* TITLE block (bottom-left over the photo) */
  #title{ position:absolute; left:46px; bottom:40px; right:44%; z-index:3; }
  #grp{ font-size:34px; font-weight:800; letter-spacing:3px; text-transform:uppercase;
        color:#fff; opacity:.92; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  #song{ font-size:104px; line-height:.92; font-weight:900; letter-spacing:-1px; margin:2px 0 14px;
         text-shadow:0 6px 26px rgba(0,0,0,.7); }
  #tag{ display:inline-block; font-size:26px; font-weight:800; letter-spacing:.5px;
        padding:8px 16px; border-radius:10px; background:var(--accent,#7c5cff);
        box-shadow:0 8px 24px -8px var(--accent,#7c5cff); }

  /* RIGHT — ranking panel */
  #rank{ position:absolute; top:0; right:0; bottom:0; width:42%;
         background:linear-gradient(180deg,#12121c,#0b0b12);
         display:flex; flex-direction:column; padding:34px 34px; }
  #rank .rhead{ font-size:22px; font-weight:800; letter-spacing:3px; color:#9a9ab0;
                text-transform:uppercase; margin-bottom:6px; flex:none; }
  /* the rows fill the whole height of the panel, evenly spread */
  #rows{ flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:14px; }
  /* TARJETA estilo ranking del visor: foto | (nombre arriba + barra abajo, hasta la derecha) */
  .row{ display:grid; grid-template-columns:auto 1fr; align-items:center; gap:20px;
        background:color-mix(in srgb, var(--c) 16%, #15151d);
        border:3px solid color-mix(in srgb, var(--c) 55%, transparent);
        border-radius:18px; padding:14px 22px;
        box-shadow:0 12px 30px -14px color-mix(in srgb, var(--c) 75%, transparent); }
  .av{ width:80px; height:80px; border-radius:50%; object-fit:cover; border:4px solid var(--c);
       background:#1a1a24; flex:none; box-shadow:0 0 0 2px rgba(0,0,0,.3); }
  .info{ min-width:0; display:flex; flex-direction:column; gap:11px; }
  .nm{ font-size:34px; font-weight:900; letter-spacing:.4px; color:color-mix(in srgb, var(--c) 82%, #fff);
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1; }
  .bar{ height:18px; border-radius:999px; background:rgba(0,0,0,.32); overflow:hidden; }
  .fill{ height:100%; border-radius:999px; background:var(--c); }

  /* editing toolbar (never part of the exported image) */
  #tools{ position:fixed; top:10px; left:10px; z-index:999; display:flex; gap:8px; align-items:center;
          flex-wrap:wrap; background:rgba(10,10,16,.85); padding:8px 10px; border-radius:10px; }
  #tools button{ border:0; border-radius:8px; padding:8px 12px; font-weight:800; font-size:13px; cursor:pointer;
                 background:#7c5cff; color:#fff; font-family:"Segoe UI",Arial,sans-serif; }
  #tools .cov{ background:transparent; border:2px solid var(--c); color:var(--c); border-radius:14px; padding:5px 9px; font-size:12px; }
  #tools .cov:hover{ background:var(--c); color:#111; }
  #tools .lbl{ color:#9a9ab0; font:700 12px "Segoe UI",Arial; }

  /* ---- Tema CLARO (cuando SONG.theme === "light", p.ej. Moonlight) ----
     Miniatura en blanco, nombres en NEGRO. El titulo va sobre la foto -> sigue blanco. */
  #thumb.light{ background:#eef0f5; color:#12131a; }
  #thumb.light #cover{ background:#eef0f5; }         /* canción clara -> fondo de la foto blanco */
  #thumb.light #rank{ background:linear-gradient(180deg,#f6f7fa,#eceef4); }
  #thumb.light .rhead{ color:#6b7180; }
  #thumb.light .row{ background:color-mix(in srgb, var(--c) 14%, #f4f5f9);
                     border-color:color-mix(in srgb, var(--c) 60%, transparent);
                     box-shadow:0 12px 30px -16px color-mix(in srgb, var(--c) 55%, transparent); }
  #thumb.light .nm{ color:color-mix(in srgb, var(--c) 70%, #000); }   /* nombre = color del miembro, oscurecido */
  #thumb.light .av{ background:#e3e5ec; }
  #thumb.light .bar{ background:rgba(0,0,0,.12); }
  #thumb.light #seam{ background:linear-gradient(90deg, rgba(238,240,245,0), #f4f5f9); }
  #thumb.light #song{ color:#fff; }                  /* titulo sobre la foto: blanco */
</style>
</head>
<body>
<div id="thumb">
  <div id="cover"><img id="coverimg" alt=""></div>
  <div id="shade"></div>
  <div id="seam"></div>
  <div id="rank"><div id="rows"></div></div>
  <div id="title">
    <div id="grp">—</div>
    <div id="song">—</div>
    <div id="tag">Line Distribution + Lyrics</div>
  </div>
</div>
<div id="tools">
  <button id="back">← Biblioteca</button>
  <button id="save">💾 Guardar PNG</button>
  <button id="reroll">🎲 Otro momento</button>
  <button id="mycover" title="Poner una foto MÍA (del PC) como foto grande de la portada — aparte de los miembros">🖼️ Foto de portada</button>
  <button id="editcover" title="Editar la foto de portada en nuestro editor (recorte / quitar fondo con IA)" style="display:none">✂️ Editar portada</button>
  <button id="delcover" title="Quitar la foto de portada (volver a la del miembro)" style="display:none">🗑️</button>
  <span class="lbl">Portada:</span>
  <span id="covers"></span>
</div>

<script>
const P = new URLSearchParams(location.search);
const SONG_URL = P.get("song") || "data/nctdream/moonlight.json";
const COVER = P.get("cover");            // optional member name for the big photo

// scale the fixed 1280x720 canvas to fit the preview window
function fit(){
  const s = Math.min(window.innerWidth/1280, window.innerHeight/720);
  document.getElementById("thumb").style.transform = "scale("+s+")";
  document.body.style.height = (720*s)+"px";
}
window.addEventListener("resize", fit); fit();

// per-member sung seconds ACCUMULATED UP TO time T (a mid-song snapshot, so the
// thumbnail doesn't spoil the final ranking).
function totalsAt(song, T){
  const t = {}; (song.members||[]).forEach(m => t[m.name]=0);
  const add = (n,s,e)=>{ if(t[n]==null) return; if(T>=e){ if(e>s) t[n]+=e-s; } else if(T>s){ t[n]+=T-s; } };
  (song.lyrics||[]).forEach(l=>{
    if(Array.isArray(l.voice)){
      l.voice.forEach(seg=>{ const who = seg[2] ? (Array.isArray(seg[2])?seg[2]:[seg[2]]) : l.members; (who||[]).forEach(n=>add(n,seg[0],seg[1])); });
    } else { (l.members||[]).forEach(n=>add(n, l.voiceStart??l.start, l.voiceEnd??l.end)); }
  });
  return t;
}

// derive the _src (original) photo path from a framed image path
function srcPhoto(img){
  const i = img.lastIndexOf("/");
  return img.slice(0,i) + "/_src" + img.slice(i);
}

fetch(SONG_URL).then(r=>r.json()).then(song=>{
  const ver = "?v=" + (Date.now());   // thumbnails are one-off; always fresh
  document.getElementById("thumb").classList.toggle("light", song.theme === "light");
  document.getElementById("grp").textContent  = song.group || "";
  const songEl = document.getElementById("song");
  songEl.textContent = song.song || "";
  // shrink long titles so they don't overrun the photo
  const len = (song.song || "").length;
  if(len > 10) songEl.style.fontSize = Math.max(52, 104 - (len - 10) * 5) + "px";

  // snapshot moment: fixed via ?t= (so preview and saved PNG match), else a
  // random point 30%–72% into the song (mid-song, never the ending).
  const dur = song.duration || 180;
  const tp = P.get("t");
  const T = (tp!=null && tp!=="") ? parseFloat(tp) : +(dur * (0.30 + Math.random()*0.42)).toFixed(2);
  window._T = T;

  const t = totalsAt(song, T);
  const ranked = [...(song.members||[])].sort((a,b)=> (t[b.name]||0)-(t[a.name]||0)).slice(0, 5);  // top 5 at that moment
  const max = Math.max(1, ...ranked.map(m=>t[m.name]||0));

  // big cover = chosen member, else whoever leads at that moment
  const coverM = (COVER && song.members.find(m=>m.name.toLowerCase()===COVER.toLowerCase())) || ranked[0] || song.members[0];
  if(coverM){
    const img = document.getElementById("coverimg");
    const coverEl = document.getElementById("cover");
    const folder = coverM.image.slice(0, coverM.image.lastIndexOf("/"));   // images/<group>/<song>
    const fr = coverM.frame;
    const ZOOM = 1.0, FACE_Y = 0.33;
    // candidatos "mi foto" (del PC) para ESTE miembro -> prioridad máxima; se
    // muestran sin recorte de frame (encuadre a pantalla), porque son una foto
    // elegida a mano (mejor calidad que la del ranking cuando sale lejos).
    // FOTO DE PORTADA propia (una por canción, sin relación con miembros): _cover.*
    const coverCands = [".png",".jpg",".jpeg",".webp"].map(e => folder + "/_cover" + e);
    let coverIsCustom = false, customCoverRel = null;
    function applyCover(){
      const W = coverEl.clientWidth||742, H = coverEl.clientHeight||720;
      const iw = img.naturalWidth, ih = img.naturalHeight; if(!iw||!ih) return;
      img.style.transformOrigin=""; img.style.transform="";
      if(fr && isFinite(fr.size) && !coverIsCustom){
        // CON frame: encuadre a la cara sobre la original (muestra el cuello).
        const side = fr.size*iw, scale = W/(side*ZOOM);
        img.style.width=(iw*scale)+"px"; img.style.height=(ih*scale)+"px";
        const fX=fr.cx*iw*scale, fY=fr.cy*ih*scale;
        img.style.left=(W/2-fX)+"px"; img.style.top=(H*FACE_Y-fY)+"px";
        img.style.transformOrigin=fX+"px "+fY+"px"; img.style.transform="rotate("+(fr.rot||0)+"deg)";
      } else {
        // portada propia o foto sin frame: a pantalla (object-fit cover).
        const fy = coverIsCustom ? 45 : (coverM.focus!=null ? coverM.focus : 45);
        img.style.left="0px"; img.style.top="0px"; img.style.width=W+"px"; img.style.height=H+"px";
        img.style.objectFit="cover"; img.style.objectPosition="center "+fy+"%";
      }
    }
    // La portada propia (_cover.*) tiene PRIORIDAD; si no, la foto del miembro.
    const memberChain = fr ? [ srcPhoto(coverM.image), coverM.image ] : [ coverM.image, srcPhoto(coverM.image) ];
    const chain = coverCands.concat(memberChain).map(u => u + ver);
    let ci=0;
    img.onload = () => {
      const loaded = ci - 1;
      coverIsCustom = loaded < coverCands.length;
      customCoverRel = coverIsCustom ? coverCands[loaded] : null;
      applyCover(); if(window._updateCoverBtns) window._updateCoverBtns();
    };
    window.addEventListener("resize", applyCover);
    const tryNext=()=>{ if(ci<chain.length){ img.onerror=tryNext; img.src=chain[ci++]; } }; tryNext();
    window._coverFolder = folder;
    window._getCustomCoverRel = () => customCoverRel;
    document.getElementById("tag").style.setProperty("--accent", coverM.color);
    document.documentElement.style.setProperty("--accent", coverM.color);
  }

  const rows = document.getElementById("rows");
  ranked.forEach((m,i)=>{
    const row = document.createElement("div"); row.className="row"; row.style.setProperty("--c", m.color);
    const barW = Math.max(6, Math.round((t[m.name]||0) / max * 100));   // barra relativa al líder
    row.innerHTML =
      '<img class="av" src="'+m.image+ver+'" alt="">'+
      '<div class="info">'+
        '<span class="nm">'+m.name+'</span>'+
        '<div class="bar"><div class="fill" style="width:'+barW+'%"></div></div>'+
      '</div>';
    rows.appendChild(row);
  });

  // toolbar (preview only — hidden while exporting, and in the plain browser)
  const tools = document.getElementById("tools");
  if(P.get("export") || !(window.desktop && window.desktop.exportThumb)){
    tools.style.display = "none";
  } else {
    document.getElementById("back").onclick = () => { location.href = "library.html"; };
    document.getElementById("save").onclick = async (e) => {
      const b = e.target; const t0 = b.textContent; b.textContent = "⏳ Guardando…"; b.disabled = true;
      let res = null;
      try{ res = await window.desktop.exportThumb({ song: SONG_URL, cover: (coverM && coverM.name) || "", t: T }); }catch(err){}
      b.textContent = (res && res.ok) ? "✓ Guardada" : (res && res.canceled ? t0 : "✕ Error");
      b.disabled = false; setTimeout(()=>b.textContent = t0, 2200);
    };
    document.getElementById("reroll").onclick = () => {
      const u = new URL(location.href);
      u.searchParams.set("t", (dur * (0.30 + Math.random()*0.42)).toFixed(2));
      location.href = u.toString();
    };
    const myc = document.getElementById("mycover");
    const edc = document.getElementById("editcover");
    const dlc = document.getElementById("delcover");
    const reloadSame = () => { const u = new URL(location.href); u.searchParams.set("t", String(window._T)); location.href = u.toString(); };
    window._updateCoverBtns = () => {
      const has = !!(window._getCustomCoverRel && window._getCustomCoverRel());
      edc.style.display = has ? "" : "none";
      dlc.style.display = has ? "" : "none";
      myc.textContent = has ? "🖼️ Cambiar portada" : "🖼️ Foto de portada";
    };
    if(!(window.desktop && window.desktop.pickThumbCover)){ myc.style.display = "none"; }
    else {
      myc.onclick = async () => {
        const t0 = myc.textContent; myc.textContent = "⏳ …"; myc.disabled = true;
        let res = null;
        try{ res = await window.desktop.pickThumbCover({ folder: window._coverFolder }); }catch(e){}
        if(res && res.ok){ reloadSame(); }
        else { myc.textContent = (res && res.canceled) ? t0 : "✕ Error"; myc.disabled = false; setTimeout(() => myc.textContent = t0, 2000); }
      };
      edc.onclick = () => {
        const rel = window._getCustomCoverRel && window._getCustomCoverRel();
        if(!rel) return;
        location.href = "cutout.html?img=" + encodeURIComponent(rel) + "&name=" + encodeURIComponent("Portada") + "&back=" + encodeURIComponent(location.href);
      };
      dlc.onclick = async () => {
        if(!confirm("¿Quitar la foto de portada y volver a la del miembro?")) return;
        dlc.disabled = true;
        let res = null;
        try{ res = await window.desktop.removeThumbCover({ folder: window._coverFolder }); }catch(e){}
        dlc.disabled = false;
        if(res && res.ok) reloadSame();
      };
    }
    const cov = document.getElementById("covers");
    (song.members||[]).forEach(m => {
      const b = document.createElement("button"); b.className = "cov"; b.textContent = m.name;
      b.style.setProperty("--c", m.color);
      b.onclick = () => { const u = new URL(location.href); u.searchParams.set("cover", m.name); location.href = u.toString(); };
      cov.appendChild(b);
    });
  }
});
</script>
</body>
</html>
