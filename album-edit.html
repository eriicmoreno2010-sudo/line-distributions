<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editar álbum</title>
<link rel="stylesheet" href="css/fonts.css?v=51">
<style>
  :root{ --bg:#0b0b10; --panel:#15151d; --panel2:#1b1b26; --border:#2a2a3a; --text:#f0f0f6; --text2:#9a9ab0; --accent:#7c5cff; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:"Montserrat","Segoe UI",Arial,sans-serif; padding:26px 34px 60px; overflow-y:auto; }
  header{ display:flex; align-items:center; gap:18px; margin-bottom:22px; flex-wrap:wrap; }
  h1{ font-size:24px; font-weight:900; }
  h1 span{ color:var(--text2); font-weight:700; font-size:16px; }
  button{ border:0; border-radius:10px; padding:10px 14px; font:800 14px "Segoe UI",Arial; cursor:pointer; }
  .ng{ background:var(--panel2); color:var(--text); border:1px solid var(--border); }
  .pri{ background:var(--accent); color:#fff; }

  /* Foto del álbum (donde sale el disco) */
  .coverbox{ display:flex; align-items:center; gap:18px; background:var(--panel); border:1px solid var(--border);
    border-radius:16px; padding:16px 18px; margin-bottom:24px; }
  .cov{ width:120px; height:120px; border-radius:16px; background:var(--panel2); border:1px dashed var(--border);
    display:flex; align-items:center; justify-content:center; font-size:44px; color:var(--text2); overflow:hidden; flex:none; }
  .cov img{ width:100%; height:100%; object-fit:cover; }
  .coverbox .hint{ color:var(--text2); font-size:13px; margin-top:4px; }

  #songs{ display:flex; flex-direction:column; gap:16px; }
  .song{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 18px; }
  .stitle{ font-size:18px; font-weight:900; margin-bottom:10px; }
  .stitle small{ color:var(--text2); font-weight:700; }
  .noaudio{ color:#ff8a8a; font-size:13px; font-weight:700; }

  .arow{ display:flex; align-items:center; gap:12px; margin:2px 0 12px; }
  .arow .ahint{ color:var(--text2); font-size:12px; font-weight:700; }
  .wave{ position:relative; height:96px; margin-top:16px; background:var(--panel2); border:1px solid var(--border);
    border-radius:10px; overflow:visible; cursor:pointer; user-select:none; touch-action:none; }
  .wave canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:10px; }
  .region{ position:absolute; top:0; bottom:0; background:color-mix(in srgb, var(--accent) 26%, transparent);
    border-left:3px solid var(--accent); border-right:3px solid var(--accent); box-sizing:border-box; z-index:2; cursor:grab; }
  /* pomo que SOBRESALE de la región morada para moverla */
  .rknob{ position:absolute; top:-13px; left:50%; transform:translateX(-50%); width:22px; height:18px; border-radius:6px;
    background:var(--accent); box-shadow:0 1px 5px rgba(0,0,0,.6); cursor:grab; z-index:5; }
  .handle{ position:absolute; top:0; bottom:0; width:16px; margin-left:-8px; cursor:ew-resize; z-index:4;
    display:flex; align-items:center; justify-content:center; }
  .handle::after{ content:""; width:4px; height:40px; background:var(--accent); border-radius:3px; box-shadow:0 0 0 2px rgba(0,0,0,.4); }
  /* barra blanca (playhead): solo INDICADOR de reproducción (no se arrastra) */
  .playhead{ position:absolute; top:-6px; bottom:0; width:2px; margin-left:-1px; background:#fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.55); z-index:6; pointer-events:none; }
  .reorder{ margin-left:10px; display:inline-flex; gap:4px; }
  .reorder button{ padding:3px 9px; font-size:13px; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:7px; }
  .times{ color:var(--text2); font-size:13px; font-weight:700; }
  .times input{ width:64px; background:var(--panel2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:5px 6px; font:700 13px "Segoe UI",Arial; }
  .crow{ display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap; }
  .crow .lbl{ color:var(--text2); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .crow label{ display:flex; align-items:center; gap:6px; color:var(--text2); font-size:13px; font-weight:700; cursor:pointer; }

  /* color de la canción (race) */
  .scolor{ display:flex; align-items:center; gap:8px; margin:0 0 10px; color:var(--text2); font-size:13px; font-weight:700; }
  input[type=color]{ width:38px; height:30px; border:1px solid var(--border); border-radius:8px; background:var(--panel2); cursor:pointer; padding:2px; }
  .secthead{ font-size:16px; font-weight:900; margin:28px 0 12px; }
  .secthead small{ color:var(--text2); font-weight:700; font-size:13px; }
  #racecolors{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px;
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .rc{ display:flex; align-items:center; gap:10px; }
  .rc img{ width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); }
  .rc .nm{ font-weight:800; font-size:14px; flex:1; min-width:0; }
  #bgaudio{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
</style>
</head>
<body>
<header>
  <button id="back" class="ng" onclick="location.href='library.html'">← Biblioteca</button>
  <h1 id="atitle">Álbum</h1>
  <span style="flex:1"></span>
  <span id="racedur" style="color:var(--text2);font-size:13px;font-weight:800;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px"></span>
  <button id="openview" class="ng">▶ Ver álbum</button>
</header>

<div class="coverbox">
  <div class="cov" id="cov">💿</div>
  <div>
    <button id="pickcover" class="pri">🖼️ Foto del álbum</button>
    <div class="hint">Es la foto que sale en la portada del álbum (donde ahora está el disco).</div>
  </div>
</div>

<div id="songs"></div>

<h2 class="secthead">🎨 Colores del race — nombres y aros (parte derecha) <small>· las barras usan el color de cada canción (arriba)</small></h2>
<div id="racecolors"></div>

<h2 class="secthead">🎧 Música de fondo <small>· suena en todas las diapositivas menos el race</small></h2>
<div id="bgaudio"></div>

<script src="js/album-edit.js?v=7"></script>
</body>
</html>
